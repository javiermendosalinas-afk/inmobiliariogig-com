name: Material del sitio oficial de GIG
on:
  workflow_dispatch:
  push:
    paths: [herramientas/sitio_oficial.py, .github/workflows/oficial.yml]
permissions:
  contents: write
jobs:
  oficial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pillow==10.4.0
      - run: mkdir -p datos && python -u herramientas/sitio_oficial.py | tee datos/oficial-registro.txt
      - run: |
          git config user.email "claude@acierta.pro"; git config user.name "Material oficial"
          git add datos fotos-web; git diff --cached --quiet || (git commit -m "Material del sitio oficial de GIG" && git push)
